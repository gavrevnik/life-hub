<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>Life Hub</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main>
      <header>
        <div class="eyebrow">PERSONAL SERVICE SYSTEM</div>
        <h1>Life Hub</h1>
        <p>Одна точка входа в локальные инструменты.</p>
        <p class="idle-note">После закрытия всех вкладок сервисы автоматически остановятся через 5 минут.</p>
      </header>
      <section class="summary" aria-live="polite">
        <span id="summary">Проверяем сервисы…</span>
        <button id="refresh" type="button">Обновить</button>
      </section>
      <section id="services" class="grid" aria-label="Сервисы"></section>
    </main>
    <template id="service-card">
      <article class="card">
        <div class="card-top">
          <span class="icon"></span>
          <span class="status"><i></i><span></span></span>
        </div>
        <h2></h2>
        <p class="description"></p>
        <div class="actions">
          <button class="launch" type="button">Открыть</button>
          <button class="stop" type="button">Остановить</button>
          <a class="github" target="_blank" rel="noreferrer">GitHub</a>
        </div>
      </article>
    </template>
    <script src="/heartbeat.js" data-life-hub-service="life-hub" defer></script>
    <script src="/app.js" defer></script>
  </body>
</html>
