<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>Life Hub</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main>
      <header>
        <div class="header-copy">
          <h1>Life Hub</h1>
          <p class="idle-note">После закрытия всех вкладок сервисы автоматически остановятся через 5 минут.</p>
        </div>
        <a
          class="github-profile"
          href="https://github.com/gavrevnik?tab=repositories"
          target="_blank"
          rel="noreferrer"
          aria-label="Репозитории gavrevnik на GitHub"
          title="GitHub"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 .5a12 12 0 0 0-3.79 23.39c.6.11.82-.26.82-.58v-2.24c-3.34.73-4.04-1.42-4.04-1.42-.55-1.39-1.33-1.76-1.33-1.76-1.09-.74.08-.73.08-.73 1.2.09 1.84 1.24 1.84 1.24 1.07 1.83 2.81 1.3 3.5.99.11-.78.42-1.3.76-1.6-2.67-.3-5.47-1.33-5.47-5.93 0-1.31.47-2.38 1.24-3.22-.12-.3-.54-1.52.12-3.18 0 0 1.01-.32 3.3 1.23A11.5 11.5 0 0 1 12 6.1c1.02 0 2.04.14 3 .4 2.29-1.55 3.3-1.23 3.3-1.23.66 1.66.24 2.88.12 3.18.77.84 1.24 1.91 1.24 3.22 0 4.61-2.81 5.62-5.48 5.92.43.37.81 1.1.81 2.22v3.5c0 .32.22.7.83.58A12 12 0 0 0 12 .5Z"/></svg>
        </a>
      </header>
      <section class="summary" aria-live="polite">
        <span id="summary">Проверяем сервисы…</span>
        <button id="refresh" type="button">Обновить</button>
      </section>
      <section id="services" class="grid" aria-label="Сервисы"></section>
    </main>
    <template id="service-card">
      <article class="card">
        <h2></h2>
        <p class="description"></p>
        <div class="actions">
          <button class="launch" type="button">Открыть</button>
          <button class="stop" type="button">Остановить</button>
        </div>
      </article>
    </template>
    <script src="/heartbeat.js" data-life-hub-service="life-hub" defer></script>
    <script src="/app.js" defer></script>
  </body>
</html>
